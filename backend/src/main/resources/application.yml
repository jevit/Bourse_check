spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${SPRING_DATASOURCE_USERNAME:portfolio}
    password: ${SPRING_DATASOURCE_PASSWORD:portfolio}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=15m

app:
  jwt:
    secret: ${JWT_SECRET:default-secret-change-in-production-must-be-256-bits}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  user:
    username: ${APP_USERNAME:admin}
    password: ${APP_PASSWORD:changeme}

server:
  port: 8080
  error:
    include-message: always

logging:
  level:
    com.bourse: INFO
    org.springframework.security: WARN
